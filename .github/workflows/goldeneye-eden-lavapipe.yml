name: Export Mesa Lavapipe Vulkan driver for Eden software tests
on:
  workflow_dispatch:
  push:
    branches: [feat/goldeneye-ptbr-localization]
    paths: ['.github/workflows/goldeneye-eden-lavapipe.yml']
permissions: { contents: read }
jobs:
  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install and validate Mesa software Vulkan ICD
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mesa-vulkan-drivers vulkan-tools
          ls -la /usr/share/vulkan/icd.d
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json vulkaninfo --summary
      - name: Package Lavapipe and transitive shared libraries (no game content)
        run: |
          mkdir -p portable/lib portable/icd
          DRIVER=/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          test -f "$DRIVER"
          cp "$DRIVER" portable/lib/
          cp /usr/share/vulkan/icd.d/lvp_icd.x86_64.json portable/icd/original_lvp_icd.json
          ldd "$DRIVER" | tee portable/ldd.txt
          # Local runtime can resolve bundled Ubuntu libraries when host differs.
          ldd "$DRIVER" | awk '/=> \/[^ ]+/ {print $3}' | sort -u | while read -r dep; do
            name=$(basename "$dep")
            case "$name" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|libresolv.so.*|ld-linux*|librt.so.*) continue ;;
            esac
            cp -L "$dep" "portable/lib/$name" || true
          done
          cat > portable/icd/lvp_icd.json <<'EOF'
          {
            "file_format_version":"1.0.0",
            "ICD":{
              "library_path":"libvulkan_lvp.so",
              "api_version":"1.3.275"
            }
          }
          EOF
          echo 'Copy portable/lib to local, then change ICD.library_path to absolute path of libvulkan_lvp.so.'
          du -sh portable
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-lavapipe-vulkan-ubuntu2404-portable
          path: portable/
          if-no-files-found: error
