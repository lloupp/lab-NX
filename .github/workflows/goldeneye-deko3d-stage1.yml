name: GoldenEye NX deko3d ARM64 smoke
on:
  workflow_dispatch:
  push:
    branches: [feat/goldeneye-deko3d-stage1-20261019]
    paths:
      - 'nxlab/switch_deko_smoke/**'
      - '.github/workflows/goldeneye-deko3d-stage1.yml'
permissions:
  contents: read
jobs:
  dksh-and-nro:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check original loader remains unchanged
        run: |
          test -s nxlab/switch_loader/source/main.c
          test -s nxlab/switch_deko_smoke/source/main.c
          test ! -f nxlab/switch_deko_smoke/romfs/shaders/triangle_vsh.dksh
      - name: Compile DKSH and genuine Switch AArch64 NRO using devkitPro
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work/nxlab/switch_deko_smoke \
            -e DEVKITPRO=/opt/devkitpro \
            devkitpro/devkita64:latest make -j2
      - name: Verify generated assets and executable type
        run: |
          set -eux
          test -s nxlab/switch_deko_smoke/goldeneye-deko-smoke.nro
          test -s nxlab/switch_deko_smoke/romfs/shaders/triangle_vsh.dksh
          test -s nxlab/switch_deko_smoke/romfs/shaders/color_fsh.dksh
          file nxlab/switch_deko_smoke/goldeneye-deko-smoke.elf
          file nxlab/switch_deko_smoke/goldeneye-deko-smoke.nro
          readelf -h nxlab/switch_deko_smoke/goldeneye-deko-smoke.elf | grep -E 'Machine:|Class:'
          strings nxlab/switch_deko_smoke/goldeneye-deko-smoke.elf |
            grep -E 'first-deko-frame-submitted|dksh-loaded|swapchain-created'
      - uses: actions/upload-artifact@v4
        with:
          name: goldeneye-deko3d-real-arm64-nro-and-dksh
          path: |
            nxlab/switch_deko_smoke/goldeneye-deko-smoke.nro
            nxlab/switch_deko_smoke/romfs/shaders/*.dksh
          if-no-files-found: error

  eden-backend:
    needs: dksh-and-nro
    name: Eden ${{ matrix.backend }} GPU probe
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, opengl]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: goldeneye-deko3d-real-arm64-nro-and-dksh
          path: nro-dist
      - name: Install software Vulkan, virtual display, and capture tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            mesa-vulkan-drivers vulkan-tools xvfb xauth xdotool scrot \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json vulkaninfo --summary
          file nro-dist/goldeneye-deko-smoke.nro
      - name: Obtain official Eden 0.2.1 and extract its Linux AppImage
        run: |
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 \
            https://stable.eden-emu.dev/v0.2.1/Eden-Linux-v0.2.1-amd64-clang-pgo.AppImage \
            -o Eden.AppImage
          chmod +x Eden.AppImage
          ./Eden.AppImage --appimage-extract > /tmp/eden-extract.log 2>&1
          test -x squashfs-root/AppRun
      - name: Execute actual Switch GPU commands under Eden and capture evidence
        run: |
          mkdir -p eden-evidence
          export HOME="$PWD/eden-home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          # 0 is OpenGL_GLSL; 1 is Vulkan in Eden's RendererBackend enum.
          # Each matrix job uses its own HOME and settings, never silently
          # claim a different backend without checking the emulator log.
          if [ "${{ matrix.backend }}" = "opengl" ]; then
            mkdir -p "$XDG_CONFIG_HOME/eden"
            printf '%s\n' '[Renderer]' 'backend=0' \
              > "$XDG_CONFIG_HOME/eden/qt-config.ini"
          fi
          export QT_QPA_PLATFORM=xcb
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe SDL_AUDIODRIVER=dummy
          timeout --signal=TERM --kill-after=4s 90s \
            xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -ec '
              ./squashfs-root/AppRun -g "$PWD/nro-dist/goldeneye-deko-smoke.nro" \
                > eden-evidence/stdout.txt 2>&1 &
              app=$!
              sleep 7
              xdotool mousemove 755 335 click 1 || true
              sleep 17
              scrot -o eden-evidence/after24s.png || true
              sleep 16
              scrot -o eden-evidence/after40s.png || true
              kill "$app" 2>/dev/null || true
              wait "$app" || true
            ' || echo "Eden exited or timed out; preserving evidence"
          find "$XDG_DATA_HOME/eden" -maxdepth 6 -name 'deko_boot_trace.txt' -print \
             -exec cp {} eden-evidence/guest_deko_trace.txt \; || true
          cp "$XDG_DATA_HOME/eden/log/eden_log.txt" eden-evidence/eden_log.txt || true
          echo "---- In-guest trace ----"
          cat eden-evidence/guest_deko_trace.txt 2>/dev/null || true
          echo "---- Eden relevant events ----"
          grep -Ei 'deko|gpu|vulkan|booting game|error|fatal' \
            eden-evidence/eden_log.txt | tail -70 || true
          echo 'No game ROM in CI. A visible triangle would prove GPU diagnostic only.'
          echo "---- Host exceptions ----"
          grep -Ei 'length_error|bad_alloc|terminate called|fatal|exception' \
            eden-evidence/stdout.txt | tail -20 || true
      - name: Verify actual emulator renderer
        if: always()
        run: |
          if [ "${{ matrix.backend }}" = "opengl" ]; then
            pattern='Renderer.backend: OpenGL'
          else
            pattern='Renderer.backend: Vulkan'
          fi
          if grep -q "$pattern" eden-evidence/eden_log.txt 2>/dev/null; then
            echo "backend=PASS (${{ matrix.backend }})" | tee eden-evidence/backend-check.txt
          else
            echo "backend=FAIL (requested ${{ matrix.backend }}; check host log)" | tee eden-evidence/backend-check.txt
            echo '::error::Selected renderer was not confirmed in Eden log'
            exit 1
          fi
      - name: Verify boot separately from GPU submission
        if: always()
        run: |
          set -e
          if grep -qx 'main-entered' eden-evidence/guest_deko_trace.txt 2>/dev/null &&
             grep -qx 'romfs-mounted' eden-evidence/guest_deko_trace.txt 2>/dev/null; then
            echo 'boot=PASS (guest main + RomFS)' | tee eden-evidence/boot-check.txt
          else
            echo 'boot=FAIL (missing main or RomFS)' | tee eden-evidence/boot-check.txt
            echo '::error::NRO boot not proven'
            exit 1
          fi
          if grep -qx 'queue-create-returned' eden-evidence/guest_deko_trace.txt 2>/dev/null; then
            echo 'queue=PASS (dkQueueCreate returned)' | tee eden-evidence/queue-check.txt
          else
            echo 'queue=FAIL (dkQueueCreate did not return)' | tee eden-evidence/queue-check.txt
          fi
      - name: Verify first frame submission separately from boot
        if: always()
        run: |
          if grep -qx 'first-deko-frame-submitted' eden-evidence/guest_deko_trace.txt 2>/dev/null; then
            echo 'frame_submission=PASS (guest returned from present)' | tee eden-evidence/frame-check.txt
          else
            echo 'frame_submission=FAIL (no guest presentation proof)' | tee eden-evidence/frame-check.txt
            echo '::error::No first frame submitted; screenshot still needs visual inspection'
            exit 1
          fi
          echo 'WARNING: passing the guest marker does not prove visible pixels.'
          echo 'Inspect after24s.png and after40s.png for an actual triangle.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldeneye-deko3d-eden-${{ matrix.backend }}-actual-execution
          path: eden-evidence/
          if-no-files-found: warn
