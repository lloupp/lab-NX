name: Python M1 M2 recipes tests
on:
  push:
    branches:
      - feat/castle-crashers-m1
      - feat/castle-crashers-m2
      - feat/automated-m2-pipeline
      - feat/reusable-recipe-supervisor
  pull_request:
    branches:
      - main
      - feat/castle-crashers-m1
      - feat/castle-crashers-m2
      - feat/automated-m2-pipeline
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic unit and orchestration tests (no game files)
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q nxlab
