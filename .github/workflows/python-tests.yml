name: Python M1 M2 recipes tests
on:
  push:
    branches:
      - feat/castle-crashers-m1
      - feat/castle-crashers-m2
      - feat/automated-m2-pipeline
      - feat/reusable-recipe-supervisor
      - feat/bonsai-local-advisor
      - feat/castle-playability-goals
      - feat/xbla-archive-e2e
      - feat/xex-lzx-verified-chain
      - feat/castle-real-powerpc-image
      - feat/castle-import-contracts
      - feat/ppc-native-leaf-proof
  pull_request:
    branches:
      - main
      - feat/castle-crashers-m1
      - feat/castle-crashers-m2
      - feat/automated-m2-pipeline
      - feat/reusable-recipe-supervisor
      - feat/bonsai-local-advisor
      - feat/castle-playability-goals
      - feat/xbla-archive-e2e
      - feat/xex-lzx-verified-chain
      - feat/castle-real-powerpc-image
      - feat/castle-import-contracts
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AES test dependency
        run: python -m pip install 'cryptography>=42,<48'
      - name: Synthetic unit and orchestration tests (no game files)
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q nxlab
      - name: Shell syntax for local SDK installers
        run: |
          bash -n scripts/install_rexglue_prebuilt.sh
          bash -n scripts/rexglue_linux_local.sh

  rexglue-sdk-smoke:
    name: Official ReXGlue SDK smoke (without game)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SDK_TAG: nightly-20261002-bd833a2a
    steps:
      - name: Download pinned upstream SDK asset
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rexglue-dl" "$RUNNER_TEMP/rexglue-sdk"
          gh release download "$SDK_TAG" \
            --repo rexglue/rexglue-sdk \
            --pattern '*linux-amd64*.zip' \
            --dir "$RUNNER_TEMP/rexglue-dl"
          test "$(find "$RUNNER_TEMP/rexglue-dl" -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          sha256sum "$RUNNER_TEMP"/rexglue-dl/*.zip
          unzip -q "$RUNNER_TEMP"/rexglue-dl/*.zip -d "$RUNNER_TEMP/rexglue-sdk"
      - name: Invoke actual prebuilt CLI
        run: |
          set -euo pipefail
          CLI=$(find "$RUNNER_TEMP/rexglue-sdk" -type f -name rexglue -print -quit)
          test -n "$CLI"
          chmod +x "$CLI"
          "$CLI" --version
          "$CLI" init --help
          "$CLI" codegen --help
          echo "SDK_OK=true" >> "$GITHUB_ENV"
      - name: Mark no-game boundaries
        run: |
          test "$SDK_OK" = true
          echo "Only SDK CLI tested; no game, codegen from game, or Switch execution."
