name: Python M1 and M2 tests
on:
  push:
    branches: [feat/castle-crashers-m1, feat/castle-crashers-m2]
  pull_request:
    branches: [main, feat/castle-crashers-m1]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests using synthetic fixtures
        run: python -m unittest discover -s tests -v
      - name: Compile modules
        run: python -m compileall -q nxlab
