name: Castle Crashers host input diagnostics
on:
  push:
    branches: [feat/castle-host-input-evidence]
  pull_request:
    branches: [feat/castle-vulkan-lavapipe]
permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verification dependencies (no game files)
        run: python -m pip install 'cryptography>=42,<48' tomli python-xlib Pillow
      - name: Test Python parsers, supervisor and X11 input replay rules
        run: python -m unittest discover -s tests -v
      - name: Compile Python syntax
        run: python -m compileall -q nxlab
